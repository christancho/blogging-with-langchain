name: channel

# Point a channel tag at an already released version, without rebuilding.
#   stg    -> what runs at home (writer.christianmendieta.ca); moves by itself on every RC that passes
#   stable -> what people installing the app get; moves by itself on promote
# Use it to roll back: e.g. stg -> v1.0.0, or stable -> the previous release.
# Run: Actions -> channel -> Run workflow (main), or
#      gh workflow run channel.yml -f version=v1.0.0 -f channel=stg
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, e.g. v1.0.0 or v1.1.0-rc.2"
        required: true
        type: string
      channel:
        description: "Channel to move"
        type: choice
        options: [stg, stable]
        default: stg

permissions:
  contents: read
  packages: write
  attestations: read

jobs:
  channel:
    uses: christancho/github-workflows/.github/workflows/docker-channel.yml@v1.3.0
    with:
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
