name: new release candidate

# Button: Actions -> "new release candidate" -> pick patch / minor / major -> Run workflow.
# The next version is computed for you (v1.0.0 + patch -> v1.0.1-rc.1, or rc.2, rc.3... if
# that line already has RCs), tagged on main, built for amd64 + arm64, smoke-tested on both,
# scanned, and published as a GitHub prerelease. It does NOT deploy: use "deploy stg".
# (Pushing a vX.Y.Z-rc.N tag by hand still works the same way.)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version goes up"
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  candidate:
    uses: christancho/github-workflows/.github/workflows/docker-candidate.yml@v1.4.0
    with:
      images: >-
        [{"name":"api","context":".","dockerfile":"api/Dockerfile"},
         {"name":"web","context":"web","dockerfile":"Dockerfile"}]
      bump: ${{ inputs.bump }}
