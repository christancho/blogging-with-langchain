name: promote

# Button: Actions -> "promote" -> Run workflow.
# Makes the release candidate you tested on stg the stable release: the same images get
# vX.Y.Z + stable + latest (nothing rebuilt), plus a GitHub release. Leave the candidate
# empty to promote exactly what stg runs now. Refuses RCs that didn't pass their checks.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Release candidate (empty = what stg runs now)"
        required: false
        type: string
      dry-run:
        description: "Only run the checks"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  attestations: read

jobs:
  promote:
    uses: christancho/github-workflows/.github/workflows/docker-promote.yml@v1.4.0
    with:
      candidate: ${{ inputs.candidate }}
      dry-run: ${{ inputs.dry-run }}
