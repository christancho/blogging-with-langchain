version: 2
updates:
  # Python dependencies (root requirements.txt: agentic/ + api/)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # mcp 2.x removed FastMCP (renamed MCPServer); a major bump needs a code
      # migration, so it must not arrive hidden in the grouped PR (#69, #93).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # Next.js frontend
  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript majors break ts-jest's peer range and npm ci (#62, #93).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Base images in Dockerfiles
  - package-ecosystem: "docker"
    directory: "/api"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/web"
    target-branch: "dev"
    schedule:
      interval: "weekly"
